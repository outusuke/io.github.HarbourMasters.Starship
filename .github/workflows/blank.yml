name: CI
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '*.*.*'
jobs:
  build:
    name: "Build Flatpak"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Starship.flatpak
          manifest-path: io.github.HarbourMasters.Starship.yml
          cache: false
      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: Starship.flatpak
  release:
    name: "Publish Release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Starship.flatpak
          generate_release_notes: true
          body: |
            Unofficial Flatpak bundle for Starship (Star Fox 64 PC port), built from the latest `main`.
            You must supply your own Star Fox 64 (US 1.0 or 1.1) ROM in .z64 format.

            **First install:**
            ```bash
            flatpak install --user Starship.flatpak
            flatpak run io.github.HarbourMasters.Starship
            ```

            **Already installed? Update to this version:**
            ```bash
            flatpak install --user --reinstall Starship.flatpak
            ```
