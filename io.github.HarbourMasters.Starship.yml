app-id: io.github.HarbourMasters.Starship
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: starship.sh

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all

modules:
  - name: starship
    buildsystem: simple
    build-commands:
      - chmod +x starship.appimage
      - ./starship.appimage --appimage-extract
      - install -Dm755 squashfs-root/usr/bin/Starship /app/starship/Starship
      - install -Dm644 squashfs-root/usr/bin/starship.o2r /app/starship/starship.o2r
      - cp -a assets /app/starship/assets
      - install -Dm644 config.yml /app/starship/config.yml
      - install -Dm644 gamecontrollerdb.txt /app/starship/gamecontrollerdb.txt
      - install -Dm644 -t /app/lib squashfs-root/usr/lib/libzip.so.4 squashfs-root/usr/lib/libspdlog.so.1.12 squashfs-root/usr/lib/libfmt.so.9 squashfs-root/usr/lib/libtinyxml2.so.10
      - install -Dm755 starship.sh /app/bin/starship.sh
      - install -Dm644 io.github.HarbourMasters.Starship.desktop /app/share/applications/io.github.HarbourMasters.Starship.desktop
      - install -Dm644 io.github.HarbourMasters.Starship.metainfo.xml /app/share/metainfo/io.github.HarbourMasters.Starship.metainfo.xml
      - install -Dm644 squashfs-root/usr/share/icons/hicolor/512x512/apps/logo.png /app/share/icons/hicolor/512x512/apps/io.github.HarbourMasters.Starship.png
    sources:
      - type: archive
        url: https://github.com/HarbourMasters/Starship/releases/download/v2.0.0/Starship-Barnard-Alfa-Linux.zip
        sha256: 85dd03d3ad8abd881aa3aa2b49ded336627b44b8ac8333e3c41b5bf7c4336289
        strip-components: 0
        only-arches: [x86_64]
      - type: script
        dest-filename: starship.sh
        commands:
          - export SHIP_HOME="${XDG_DATA_HOME}/starship"
          - mkdir -p "$SHIP_HOME/mods"
          - cd "$SHIP_HOME"
          # the game reads config.yml and assets/ from the working directory
          - ln -sfn /app/starship/config.yml "$SHIP_HOME/config.yml"
          - ln -sfn /app/starship/assets "$SHIP_HOME/assets"
          - exec /app/starship/Starship "$@"
      - type: file
        path: io.github.HarbourMasters.Starship.desktop
      - type: file
        path: io.github.HarbourMasters.Starship.metainfo.xml
